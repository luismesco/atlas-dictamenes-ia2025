<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Luis Montañez Escobar"><title>Visor de documentos</title><link rel="stylesheet" href="../vendor/pdfjs/pdf_viewer.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px Arial,sans-serif;background:#ede9eb;color:#292329}button,input,select{font:inherit;min-height:44px;border:1px solid #c8bcc2;border-radius:6px;background:#fff;color:inherit;padding:6px 10px}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9b753f;outline-offset:2px}.pdf-tools{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px;background:#fff;border-bottom:1px solid #c8bcc2;position:sticky;top:0;z-index:10}.pdf-tools label{display:flex;align-items:center;gap:6px}.pdf-tools input{width:72px}.pdf-tools button{min-width:44px}.pdf-scroll{height:calc(100dvh - 64px);overflow:auto;overscroll-behavior:contain;padding:16px}.pdf-page{position:relative;margin:0 auto;background:white;box-shadow:0 2px 12px #33223322}.pdf-page canvas{display:block}.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;text-align:initial}.pdf-status{text-align:center;margin:0;padding:8px;background:white;font-size:14px}#pdfError{padding:24px;line-height:1.6} @media(max-width:650px){.pdf-tools{gap:5px}.pdf-tools label{font-size:13px}.pdf-tools select{max-width:140px}.pdf-scroll{height:calc(100dvh - 120px);padding:8px}}
body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.pdf-tools,.pdf-status{flex-shrink:0}.pdf-scroll{flex:1;min-height:0;height:auto!important;-webkit-overflow-scrolling:touch;overscroll-behavior:auto}.pdf-tools{position:relative;top:auto}@media(max-width:650px){.pdf-tools{display:grid;grid-template-columns:44px minmax(0,1fr) auto 44px;gap:4px;padding:6px}.pdf-tools #prev{grid-column:1;grid-row:1}.pdf-tools label:has(#page){grid-column:2;grid-row:1}.pdf-tools #pageCount{grid-column:3;grid-row:1;font-size:13px}.pdf-tools #next{grid-column:4;grid-row:1}.pdf-tools #minus{grid-column:1;grid-row:2}.pdf-tools label:has(#zoom){grid-column:2/4;grid-row:2;justify-content:center}.pdf-tools #plus{grid-column:4;grid-row:2}.pdf-tools input,.pdf-tools select{font-size:16px}.pdf-tools #page{width:60px}.pdf-tools #zoom{max-width:none;flex:1}.pdf-status{font-size:13px;padding:5px}.pdf-scroll{padding:8px}}
</style><div class="pdf-tools" role="toolbar" aria-label="Página y escala del PDF"><button id="prev" aria-label="Página anterior">←</button><label>Página <input id="page" type="number" value="1" min="1" aria-label="Número de página"></label><span id="pageCount">de …</span><button id="next" aria-label="Página siguiente">→</button><button id="minus" aria-label="Disminuir zoom del PDF">−</button><label>Zoom <select id="zoom" aria-label="Zoom del PDF"><option value="fit">Ajustar página</option><option value="width">Ajustar ancho</option><option value="25">25 %</option><option value="50">50 %</option><option value="75">75 %</option><option value="100">100 %</option><option value="125">125 %</option><option value="150">150 %</option><option value="200">200 %</option><option value="300">300 %</option></select></label><button id="plus" aria-label="Aumentar zoom del PDF">+</button></div><p id="status" class="pdf-status" role="status">Cargando documento…</p><main id="scroll" class="pdf-scroll" aria-label="Documento PDF"><div id="paper" class="pdf-page"><canvas id="canvas" aria-hidden="true"></canvas><div id="text" class="textLayer"></div></div><p id="pdfError" hidden></p></main><script type="module" src="pdf-viewer.js"></script></html>
