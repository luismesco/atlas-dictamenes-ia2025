<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="author" content="Luis Montañez Escobar"><title>Quintana Roo · Láminas de exposición</title><style>

</style></head><body><header><h1>Quintana Roo · Láminas</h1><div class="actions"><a href="qroo-guion.html">← Guion</a><a id="download" href="QROO_No_atendidas_y_seguimientos.pdf" download>PDF ↓</a></div></header><nav aria-label="Navegar por las láminas"><label>Estatus<select id="status"><option value="">Todos</option></select></label><label>Observación<select id="slide"></select></label><button id="previous" aria-label="Página anterior">←</button><button id="next" aria-label="Página siguiente">→</button></nav><p id="scope" role="status" aria-live="polite"></p><iframe id="viewer" title="Lámina de Quintana Roo"></iframe><script>
const slides=[{"id": "10", "status": "No atendida", "title": "ID 10 · Propaganda: soporte documental", "pageStart": 1, "pageEnd": 1}, {"id": "23", "status": "No atendida", "title": "ID 23 · Registro extemporáneo de operaciones", "pageStart": 2, "pageEnd": 3}, {"id": "8", "status": "No atendida", "title": "ID 8 · Reportes trimestrales de gasto programado", "pageStart": 4, "pageEnd": 5}, {"id": "15", "status": "Seguimiento Dictamen CEN", "title": "ID 15 · CFDI recibidos no localizados", "pageStart": 6, "pageEnd": 6}, {"id": "16", "status": "Seguimiento Dictamen CEN", "title": "ID 16 · CFDI de operaciones de otros ejercicios", "pageStart": 7, "pageEnd": 7}, {"id": "12", "status": "Seguimiento", "title": "ID 12 · Cuentas por pagar", "pageStart": 8, "pageEnd": 8}, {"id": "14", "status": "Seguimiento", "title": "ID 14 · Cuotas del ejercicio 2025", "pageStart": 9, "pageEnd": 9}, {"id": "19", "status": "Seguimiento", "title": "ID 19 · IMSS: pago y regularización del saldo", "pageStart": 10, "pageEnd": 10}, {"id": "13", "status": "Seguimiento", "title": "ID 13 · Pasivos generados en 2024", "pageStart": 11, "pageEnd": 11}, {"id": "9", "status": "Seguimiento", "title": "ID 9 · Cuentas por cobrar", "pageStart": 12, "pageEnd": 12}, {"id": "3", "status": "Informativa", "title": "ID 3 · Solicitudes del informe anual 2024", "pageStart": 13, "pageEnd": 13}, {"id": "17", "status": "Seguimiento y Vista única en el CEN", "title": "ID 17 · Confirmaciones con autoridades", "pageStart": 14, "pageEnd": 14}, {"id": "18", "status": "Seguimiento Dictamen CEN", "title": "ID 18 · Cuenta bancaria no reportada", "pageStart": 15, "pageEnd": 15}, {"id": "20", "status": "Seguimiento a Dictamen CEN", "title": "ID 20 · Confirmaciones con proveedores", "pageStart": 16, "pageEnd": 17}, {"id": "21", "status": "Seguimiento a Dictamen CEN", "title": "ID 21 · Confirmaciones con casas encuestadoras", "pageStart": 18, "pageEnd": 18}, {"id": "24", "status": "Seguimiento", "title": "ID 24 · Traspaso de saldos de campaña", "pageStart": 19, "pageEnd": 19}, {"id": "26", "status": "Sin pronunciamiento", "title": "ID 26 · Recomendación sobre comprobación fiscal", "pageStart": 20, "pageEnd": 21}];
const pdfPages=21;
const pdf='QROO_No_atendidas_y_seguimientos.pdf?v=fca0602bf0ed';
const viewer=document.getElementById('viewer'),status=document.getElementById('status'),select=document.getElementById('slide'),previous=document.getElementById('previous'),next=document.getElementById('next'),scope=document.getElementById('scope');let current=null,currentPage=null;
document.getElementById('download').href=pdf;
function group(s){return s.startsWith('Seguimiento')?'Seguimiento':s}
[...new Set(slides.map(s=>group(s.status)))].forEach(s=>status.add(new Option(s,s)));
function filtered(){return slides.filter(s=>!status.value||group(s.status)===status.value)}
function pagesFor(list){return list.flatMap(s=>Array.from({length:(s.pageEnd??s.pageStart??s.page)-(s.pageStart??s.page)+1},(_,i)=>({s,page:(s.pageStart??s.page)+i})))}
function show(id,hash=true,requestedPage=null){let list=filtered(),s=list.find(s=>s.id===String(id))||list[0];if(!s)return;current=s;select.value=s.id;let start=s.pageStart??s.page,end=s.pageEnd??start,page=Number(requestedPage);if(!Number.isInteger(page)||page<start||page>end)page=start;currentPage=page;let pages=pagesFor(list),position=pages.findIndex(x=>x.s.id===s.id&&x.page===page);previous.disabled=position===0;next.disabled=position===pages.length-1;scope.textContent='Caso '+(list.indexOf(s)+1)+' de '+list.length+' · Página '+page+' de '+pdfPages+(page>start?' · Continuación':'')+' · '+s.status;viewer.title=s.title+(page>start?' · Continuación':'');if(viewer.dataset.page!==String(page)){viewer.src='pdf-viewer.html?file='+encodeURIComponent(pdf)+'&page='+page+'&zoom=fit';viewer.dataset.page=page}if(hash)history.replaceState(null,'','#id-'+s.id+(page>start?'-p-'+page:''))}
function populate(id,page){select.replaceChildren();filtered().forEach(s=>select.add(new Option(s.title,s.id)));show(id,true,page)}
function move(delta){let pages=pagesFor(filtered()),i=pages.findIndex(x=>x.s.id===current.id&&x.page===currentPage),x=pages[i+delta];if(x)show(x.s.id,true,x.page)}
status.addEventListener('change',()=>populate(current?.id));select.addEventListener('change',()=>show(select.value));previous.addEventListener('click',()=>move(-1));next.addEventListener('click',()=>move(1));document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();move(e.key==='ArrowRight'?1:-1)}});
function fromHash(){let match=location.hash.match(/^#id-(\d+)(?:-p-(\d+))?$/),id=match?.[1],page=match?.[2];let legacy=location.hash.match(/^#lamina-(\d+)$/)?.[1];if(!id&&legacy){page=Number(legacy);id=slides.find(s=>(s.pageStart??s.page)<=page&&(s.pageEnd??s.pageStart??s.page)>=page)?.id}if(id&&slides.some(s=>s.id===id)){status.value='';populate(id,page)}else populate(slides[0].id)}window.addEventListener('hashchange',fromHash);fromHash();
</script></body></html>
